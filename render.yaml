services:
  - type: web
    name: converto-frontend
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_USE_MOCK
        value: "true"
      - key: VITE_API_BASE_URL
        value: https://api.example.com/api