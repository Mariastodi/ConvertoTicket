databases:
  - name: converto-db
    plan: free

services:
  - type: web
    name: converto-frontend
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_USE_MOCK
        value: "true"
      - key: VITE_API_BASE_URL
        value: https://converto-api.onrender.com/api

  - type: web
    name: converto-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: "Converto API"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: converto-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: converto-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: converto-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: converto-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: converto-db
          property: password
      - key: FRONTEND_URL
        value: https://converto-frontend.onrender.com
      - key: SANCTUM_STATEFUL_DOMAINS
        value: converto-frontend.onrender.com
